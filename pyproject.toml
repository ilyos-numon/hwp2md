[project]
name = "hwp2markdown"
dynamic = ["version"]
description = "Convert HWP 5.0 documents to Markdown without Hancom Office"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    "lxml>=5",
    "olefile>=0.46",
]

[project.optional-dependencies]
web = ["starlette>=0.37", "uvicorn>=0.30"]

[project.scripts]
hwp2md = "hwp2md.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "lxml-stubs>=0.5.1",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "playwright>=1.45",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/hwp2md/__init__.py"

[tool.hatch.build.targets.sdist]
only-include = ["src/hwp2md", "README.md", "LICENSE", "NOTICE", "pyproject.toml"]
exclude = ["__pycache__", "*.pyc"]

[tool.hatch.build.targets.wheel]
packages = ["src/hwp2md"]
exclude = ["__pycache__", "*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "olefile"
ignore_missing_imports = true
