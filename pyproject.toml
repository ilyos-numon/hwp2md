[project]
name = "hwp2markdown"
dynamic = ["version"]
description = "Convert Korean HWP, HWPX and HWPML documents to Markdown without Hancom Office"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    "lxml>=5",
    "olefile>=0.46",
]
keywords = ["hwp", "hwpx", "hwpml", "markdown", "converter", "korean", "hangul", "hancom", "document-conversion", "pyodide"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Natural Language :: Korean",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Office Suites",
  "Topic :: Text Processing :: Markup :: Markdown",
  "Topic :: Utilities",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://ilyos-numon.github.io/hwp2md/"
Repository = "https://github.com/ilyos-numon/hwp2md"
Issues = "https://github.com/ilyos-numon/hwp2md/issues"
Changelog = "https://github.com/ilyos-numon/hwp2md/blob/main/CHANGELOG.md"

[project.optional-dependencies]
web = ["starlette>=0.37", "uvicorn>=0.30"]

[project.scripts]
hwp2md = "hwp2md.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "lxml-stubs>=0.5.1",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "playwright>=1.45",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/hwp2md/__init__.py"

[tool.hatch.build.targets.sdist]
only-include = ["src/hwp2md", "README.md", "LICENSE", "NOTICE", "pyproject.toml"]
exclude = ["__pycache__", "*.pyc"]

[tool.hatch.build.targets.wheel]
packages = ["src/hwp2md"]
exclude = ["__pycache__", "*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "olefile"
ignore_missing_imports = true
