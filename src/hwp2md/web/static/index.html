<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>hwp2md 미리보기</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body data-state="idle">
  <header class="topbar">
    <div class="brand">
      <h1>hwp2md 미리보기</h1>
      <p class="tagline">HWP·HWPX 문서를 Markdown 으로 바꿔 바로 확인합니다.</p>
    </div>
    <div class="mode">
      <label class="switch" for="mode-toggle">
        <input type="checkbox" id="mode-toggle" disabled>
        <span class="switch-track" aria-hidden="true"></span>
        <span class="switch-label">브라우저 안에서만 처리</span>
      </label>
      <span id="mode-status" data-state="server">서버 모드</span>
    </div>
  </header>

  <main class="layout">
    <section id="drop-zone" tabindex="0" role="button" aria-label="파일 선택">
      <input type="file" id="file-input" accept=".hwp,.hwpx" hidden>
      <div class="drop-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
      </div>
      <p class="drop-title">HWP·HWPX 파일을 끌어다 놓거나 클릭해서 선택</p>
      <p class="drop-hint">최대 50MB · HWP 5.0 / HWPX</p>
    </section>

    <div id="error" role="alert" hidden></div>

    <section class="result-bar">
      <div class="result-info">
        <span id="file-name">선택한 파일 없음</span>
        <span id="result-meta"></span>
      </div>
      <span class="busy" aria-hidden="true">변환 중…</span>
      <button type="button" id="download" disabled>zip 다운로드</button>
    </section>

    <section class="panes">
      <article class="pane">
        <h2 class="pane-title">미리보기</h2>
        <div id="preview" class="markdown-body"><p class="placeholder">파일을 선택하면 여기에 렌더링된 문서가 보입니다.</p></div>
      </article>
      <article class="pane">
        <h2 class="pane-title">원문 Markdown</h2>
        <pre id="raw"></pre>
      </article>
    </section>
  </main>

  <script src="/static/vendor/marked.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
