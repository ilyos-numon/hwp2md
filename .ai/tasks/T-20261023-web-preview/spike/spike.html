<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>hwp2md pyodide spike</title>
</head>
<body>
<pre id="log"></pre>
<script>
// S2 spike: load Pyodide + lxml from CDN, unpack pkg.zip, convert each sample in-browser.
// Query: ?v=<pyodide version>&convert=1|0
(async () => {
  const params = new URLSearchParams(location.search);
  const VER = params.get("v") || "0.27.7";
  const doConvert = params.get("convert") !== "0";
  const PYODIDE_BASE = `https://cdn.jsdelivr.net/pyodide/v${VER}/full/`;
  const log = (m) => { document.getElementById("log").textContent += m + "\n"; };
  const out = { version: VER, stage: "start" };
  window.__spike = null;
  try {
    const t0 = performance.now();
    out.stage = "script";
    await new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = PYODIDE_BASE + "pyodide.js";
      s.onload = resolve;
      s.onerror = () => reject(new Error("network: failed to load " + s.src));
      document.head.appendChild(s);
    });
    out.stage = "loadPyodide";
    const pyodide = await loadPyodide({ indexURL: PYODIDE_BASE });
    out.stage = "loadPackage";
    let pkgErr = null;
    await pyodide.loadPackage("lxml", {
      errorCallback: (m) => { pkgErr = (pkgErr ? pkgErr + "; " : "") + m; },
    });
    if (pkgErr) throw new Error("loadPackage lxml: " + pkgErr);
    out.load_seconds = (performance.now() - t0) / 1000;
    out.lxml_version = pyodide.runPython(
      "import lxml.etree as e; '.'.join(str(x) for x in e.LXML_VERSION)"
    );
    log("loaded in " + out.load_seconds.toFixed(2) + "s, lxml " + out.lxml_version);

    out.stage = "unpack";
    const buf = await (await fetch("pkg.zip")).arrayBuffer();
    pyodide.unpackArchive(buf, "zip", { extractDir: "/hwp2md_pkg" });
    out.stage = "import";
    pyodide.runPython("import sys; sys.path.insert(0, '/hwp2md_pkg'); import hwp2md");

    if (doConvert) {
      out.stage = "convert";
      const samples = await (await fetch("samples.json")).json();
      pyodide.FS.mkdirTree("/samples");
      out.results = {};
      for (const name of samples) {
        const data = new Uint8Array(await (await fetch("samples/" + encodeURIComponent(name))).arrayBuffer());
        const path = "/samples/" + name;
        pyodide.FS.writeFile(path, data);
        pyodide.globals.set("_spike_path", path);
        try {
          out.results[name] = { markdown: pyodide.runPython(
            "import hwp2md; hwp2md.convert(_spike_path, '/tmp/out').markdown"
          ) };
        } catch (e) {
          out.results[name] = { error: String(e) };
        }
        log("converted " + name);
      }
    }
    out.stage = "done";
    out.ok = true;
  } catch (e) {
    out.ok = false;
    out.error = String(e && e.message ? e.message : e);
    log("ERROR at " + out.stage + ": " + out.error);
  }
  window.__spike = out;
})();
</script>
</body>
</html>
