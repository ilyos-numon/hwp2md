name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest tests/unit -q -m "not real_samples"
      - run: uv build --out-dir dist
      - run: uvx --from 'twine>=6.1' twine check --strict dist/*
      - run: uv run python scripts/check_dist.py dist --tag "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/hwp2markdown/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  binaries:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "windows-2022"
            platform: windows-x64
            asset: hwp2md-windows-x64.exe
          - os: "macos-15"
            platform: macos-arm64
            asset: hwp2md-macos-arm64
          - os: "macos-15-intel"
            platform: macos-x64
            asset: hwp2md-macos-x64
          - os: "ubuntu-22.04"
            platform: linux-x64
            asset: hwp2md-linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        id: py
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --python "${{ steps.py.outputs.python-path }}"
      - run: uv run --with pyinstaller==6.22.3 python scripts/build_binary.py --out build/bin
      - run: uv run pytest tests/e2e/test_binary_smoke.py -q
        env:
          HWP2MD_BINARY: build/bin/${{ matrix.asset }}
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.platform }}
          path: build/bin/${{ matrix.asset }}
          if-no-files-found: error

  github-release:
    needs: [binaries, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          merge-multiple: true
          path: assets
      - name: Write SHA256SUMS
        working-directory: assets
        run: sha256sum hwp2md-* | sort -k2 > SHA256SUMS
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" assets/* -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" assets/* -R "$GITHUB_REPOSITORY" \
              --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
